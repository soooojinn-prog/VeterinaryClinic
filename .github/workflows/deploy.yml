name: Deploy theme to Cafe24

# 트리거:
#  - master 브랜치에 push 되면서 테마/워크플로우 변경분이 있을 때
#  - GitHub UI 에서 수동 실행 (workflow_dispatch)
on:
  push:
    branches: [master]
    paths:
      - 'wp-content/themes/doduri/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 같은 브랜치에서 동시 배포 충돌 방지
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===== 1. PHP 구문 검사 =====
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Run php -l on all theme PHP files
        run: |
          set -e
          ERRORS=0
          while IFS= read -r f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              ERRORS=$((ERRORS+1))
            fi
          done < <(find wp-content/themes/doduri -type f -name '*.php')
          if [ "$ERRORS" -ne 0 ]; then
            echo "Found $ERRORS PHP syntax errors"
            exit 1
          fi
          echo "✅ All PHP files passed syntax check"

  # ===== 2. SFTP 배포 =====
  deploy:
    name: SFTP deploy to Cafe24
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy theme via SFTP (lftp mirror)
        # lftp CLI 직접 사용 — Node 액션의 Node 24 강제 전환 no-op(가짜 성공) 이슈 회피.
        # mirror -R = 로컬→원격 업로드. 실제 전송 로그가 남아 배포 성공 여부를 검증 가능.
        env:
          SFTP_HOST: ${{ secrets.CAFE24_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.CAFE24_SFTP_PORT }}
          SFTP_USER: ${{ secrets.CAFE24_SFTP_USER }}
          SFTP_PASS: ${{ secrets.CAFE24_SFTP_PASS }}
        run: |
          set -euo pipefail
          # 카페24 WP 루트는 사용자 홈 아래 ./www/ (홈 자체는 wp 루트가 아님!).
          # --no-perms: 공유호스팅에서 chmod 실패 방지. 원격 삭제는 하지 않음(수동 파일 보호).
          lftp -u "$SFTP_USER","$SFTP_PASS" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<'LFTP_SCRIPT'
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --verbose --no-perms ./wp-content/themes/doduri/ ./www/wp-content/themes/doduri/
          bye
          LFTP_SCRIPT

  # ===== 3. Discord 알림 =====
  notify:
    name: Notify Discord
    needs: [lint, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compose status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "color=3329330" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.lint.result }}" = "failure" ]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          fi

      - name: Discord webhook
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ steps.status.outputs.result }}
          title: '도두리 동물병원 — 배포'
          description: |
            **브랜치**: `${{ github.ref_name }}`
            **커밋**: ${{ github.event.head_commit.message || '수동 실행' }}
            **작성자**: ${{ github.actor }}
          username: 'Doduri Deploy Bot'
          color: ${{ steps.status.outputs.color }}
          nofail: true
